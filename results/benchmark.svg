<text class="sub" x="24" y="54">15 facts planted in a 20-turn Claude Code session (rules, decisions + why, dead ends, gotchas).</text>
<text class="sub" x="24" y="70">Score out of 30, blind LLM judge, mean over n repetitions.</text>
